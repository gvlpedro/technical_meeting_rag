<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1400" role="img" aria-label="System architecture: Bronze raw ingestion feeds Silver's Actor-Critic-Boss clarification loop, which feeds Gold's entity extraction and evolution ledger; an LLM router serves Silver and Gold, a human reviewer resolves pending questions, and a chat script plus a backfill script consume and rebuild Gold.">
  <title>Technical Meeting RAG — System Architecture</title>
  <desc>Layered data flow from raw YouTube transcripts through the Bronze, Silver and Gold medallion layers, with the LLM router, human-in-the-loop review, and the two Gold-consuming scripts.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
      .title { font-size: 23px; font-weight: 700; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 12px; fill: #c3c2b7; }
      .small { font-size: 11px; fill: #898781; }
      .edgeLabel { font-size: 11px; fill: #c3c2b7; }
      .surface { fill: #1a1a19; stroke: #383835; stroke-width: 1.5; }
      .tableFill { fill: #232322; stroke: #383835; stroke-width: 1.25; }
      .edge { stroke: #898781; stroke-width: 1.75; fill: none; }
      .edgeDashed { stroke: #898781; stroke-width: 1.5; fill: none; stroke-dasharray: 6 5; }
    </style>
    <marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#898781"/>
    </marker>
    <marker id="aMagenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d55181"/>
    </marker>
    <marker id="aViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9085e9"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1440" height="1400" fill="#0d0d0d"/>

  <text x="590" y="44" text-anchor="middle" class="title">Technical Meeting RAG — System Architecture</text>
  <text x="590" y="66" text-anchor="middle" class="b">Bronze → Silver → Gold medallion pipeline — code-accurate as of the current main branch</text>

  <!-- Sources -->
  <rect x="350" y="90" width="480" height="64" rx="10" class="surface"/>
  <text x="590" y="116" text-anchor="middle" class="h">Input transcripts (.vtt)</text>
  <text x="590" y="136" text-anchor="middle" class="b">input/transcriptions/ingestion_date=YYYYMMDD/</text>

  <!-- fan-out to entry points -->
  <line x1="590" y1="154" x2="590" y2="172" class="edge"/>
  <line x1="380" y1="172" x2="800" y2="172" class="edge"/>
  <line x1="380" y1="172" x2="380" y2="192" class="edge" marker-end="url(#aGray)"/>
  <line x1="800" y1="172" x2="800" y2="192" class="edge" marker-end="url(#aGray)"/>

  <!-- Entry points -->
  <rect x="190" y="192" width="380" height="76" rx="10" class="surface"/>
  <text x="380" y="216" text-anchor="middle" class="h">HTTP API — app/routers/</text>
  <text x="380" y="236" text-anchor="middle" class="b">POST /v1/ingest — ingestion.py</text>
  <text x="380" y="252" text-anchor="middle" class="b">POST /v1/completions — completions.py</text>

  <rect x="610" y="192" width="380" height="76" rx="10" class="surface"/>
  <text x="800" y="216" text-anchor="middle" class="h">CLI — Makefile targets</text>
  <text x="800" y="236" text-anchor="middle" class="b">make ingestion · questions · clarify · chat</text>
  <text x="800" y="252" text-anchor="middle" class="b">scripts/ingest.py · questions.py · clarify.py · chat_gold.py</text>

  <!-- fan-in to Bronze -->
  <line x1="380" y1="268" x2="380" y2="286" class="edge"/>
  <line x1="800" y1="268" x2="800" y2="286" class="edge"/>
  <line x1="380" y1="286" x2="800" y2="286" class="edge"/>
  <line x1="590" y1="286" x2="590" y2="300" class="edge" marker-end="url(#aGray)"/>

  <!-- BRONZE -->
  <rect x="110" y="300" width="960" height="112" rx="12" class="surface"/>
  <rect x="110" y="300" width="8" height="112" fill="#3987e5"/>
  <text x="150" y="326" class="h">BRONZE — raw ingestion</text>
  <text x="150" y="348" class="b">ingestion/service.py :: ingest_bronze()</text>
  <text x="150" y="366" class="b">parse_vtt → chunk_text(size, overlap) → embed() (sentence-transformers)</text>
  <text x="150" y="384" class="small">no LLM call · one row per chunk · table: bronze_documents</text>

  <line x1="590" y1="412" x2="590" y2="460" class="edge" marker-end="url(#aGray)"/>
  <text x="605" y="440" class="edgeLabel">load_bronze() reads rows for ingestion_date</text>

  <!-- SILVER -->
  <rect x="110" y="460" width="960" height="190" rx="12" class="surface"/>
  <rect x="110" y="460" width="8" height="190" fill="#d95926"/>
  <text x="150" y="486" class="h">SILVER — Actor · Critic · Boss clarification loop</text>
  <text x="150" y="508" class="b">agents/graph.py — LangGraph, triggered by make clarify</text>
  <text x="150" y="526" class="b">load_bronze → generate questions (architecture + data-contract) → classify_questions</text>
  <text x="150" y="544" class="b">→ synthesize_document (Actor) → critic_document → boss_decide → write_document → chunk_and_embed</text>
  <text x="150" y="566" class="small">human-in-the-loop via interrupt() whenever questions remain unresolved</text>
  <text x="150" y="584" class="small">full node-by-node detail → doc/agent_graph.svg</text>

  <!-- Human reviewer -->
  <rect x="1140" y="470" width="260" height="90" rx="10" class="surface"/>
  <rect x="1140" y="470" width="8" height="90" fill="#d55181"/>
  <text x="1164" y="500" class="h">Human reviewer</text>
  <text x="1164" y="520" class="small">answers batched</text>
  <text x="1164" y="536" class="small">pending_questions via interrupt()</text>
  <line x1="1070" y1="505" x2="1140" y2="505" class="edgeDashed" stroke="#d55181" marker-end="url(#aMagenta)" marker-start="url(#aMagenta)"/>
  <text x="1105" y="498" text-anchor="middle" class="edgeLabel">interrupt()</text>

  <!-- LLM Router -->
  <rect x="1140" y="590" width="260" height="100" rx="10" class="surface"/>
  <rect x="1140" y="590" width="8" height="100" fill="#9085e9"/>
  <text x="1164" y="618" class="h">LLM Router</text>
  <text x="1164" y="636" class="small">llm/router.py</text>
  <text x="1164" y="652" class="small">LiteLLM: OpenAI → Anthropic fallback</text>
  <line x1="1070" y1="600" x2="1140" y2="625" class="edgeDashed" stroke="#9085e9" marker-end="url(#aViolet)"/>
  <text x="1080" y="595" class="edgeLabel">router.complete()</text>

  <!-- fan-out Silver -> 3 tables -->
  <line x1="590" y1="650" x2="590" y2="668" class="edge"/>
  <line x1="270" y1="668" x2="910" y2="668" class="edge"/>
  <line x1="270" y1="668" x2="270" y2="690" class="edge" marker-end="url(#aGray)"/>
  <line x1="590" y1="668" x2="590" y2="690" class="edge" marker-end="url(#aGray)"/>
  <line x1="910" y1="668" x2="910" y2="690" class="edge" marker-end="url(#aGray)"/>

  <rect x="130" y="690" width="280" height="56" rx="8" class="tableFill"/>
  <text x="270" y="712" text-anchor="middle" class="h">silver_documents</text>
  <text x="270" y="730" text-anchor="middle" class="small">hash-versioned ADR per (source, version)</text>

  <rect x="450" y="690" width="280" height="56" rx="8" class="tableFill"/>
  <text x="590" y="712" text-anchor="middle" class="h">silver_clarifications</text>
  <text x="590" y="730" text-anchor="middle" class="small">append-only Q&amp;A history</text>

  <rect x="770" y="690" width="280" height="56" rx="8" class="tableFill"/>
  <text x="910" y="712" text-anchor="middle" class="h">silver_chunks</text>
  <text x="910" y="730" text-anchor="middle" class="small">1 embedding per ADR, upsert per version</text>

  <!-- fan-in tables -> Gold -->
  <line x1="270" y1="746" x2="270" y2="764" class="edge"/>
  <line x1="590" y1="746" x2="590" y2="764" class="edge"/>
  <line x1="910" y1="746" x2="910" y2="764" class="edge"/>
  <line x1="270" y1="764" x2="910" y2="764" class="edge"/>
  <line x1="590" y1="764" x2="590" y2="800" class="edge" marker-end="url(#aGray)"/>
  <text x="605" y="785" class="edgeLabel">same graph run — Gold reads the just-approved ADR from shared state</text>

  <!-- GOLD -->
  <rect x="110" y="800" width="960" height="140" rx="12" class="surface"/>
  <rect x="110" y="800" width="8" height="140" fill="#199e70"/>
  <text x="150" y="826" class="h">GOLD — entity extraction &amp; evolution ledger</text>
  <text x="150" y="848" class="b">agents/gold_service.py + graph.py :: extract_gold_facts → resolve_gold_identity → persist_gold_evolution</text>
  <text x="150" y="866" class="b">identity: exact alias → pg_trgm fuzzy match (&gt;0.6 similarity) → mint uuid4</text>
  <text x="150" y="884" class="b">versioning: hash-compare-then-bump per (entity_type, entity_id) — components, data contracts, architecture</text>
  <text x="150" y="902" class="small">runs inside the same Silver graph run, right after chunk_and_embed — no separate pipeline</text>
  <text x="150" y="920" class="small">skips a source already extracted for this exact (source_component, version)</text>

  <line x1="1070" y1="860" x2="1105" y2="860" class="edgeDashed" stroke="#9085e9"/>
  <line x1="1105" y1="860" x2="1105" y2="690" class="edgeDashed" stroke="#9085e9"/>
  <line x1="1105" y1="690" x2="1140" y2="690" class="edgeDashed" stroke="#9085e9" marker-end="url(#aViolet)"/>
  <text x="1112" y="780" class="edgeLabel">router.complete()</text>

  <!-- fan-out Gold -> 2 tables -->
  <line x1="590" y1="940" x2="590" y2="958" class="edge"/>
  <line x1="420" y1="958" x2="820" y2="958" class="edge"/>
  <line x1="420" y1="958" x2="420" y2="980" class="edge" marker-end="url(#aGray)"/>
  <line x1="820" y1="958" x2="820" y2="980" class="edge" marker-end="url(#aGray)"/>

  <rect x="280" y="980" width="280" height="56" rx="8" class="tableFill"/>
  <text x="420" y="1002" text-anchor="middle" class="h">gold_evolution</text>
  <text x="420" y="1020" text-anchor="middle" class="small">append-only version per (entity_type, entity_id)</text>

  <rect x="680" y="980" width="280" height="56" rx="8" class="tableFill"/>
  <text x="820" y="1002" text-anchor="middle" class="h">gold_aliases</text>
  <text x="820" y="1020" text-anchor="middle" class="small">name → entity_id lookup, never versioned</text>

  <!-- Consumers -->
  <line x1="420" y1="1036" x2="420" y2="1110" class="edge" marker-end="url(#aGray)"/>
  <text x="420" y="1073" text-anchor="middle" class="edgeLabel">cosine top-k retrieval</text>

  <rect x="210" y="1110" width="420" height="90" rx="10" class="surface"/>
  <text x="234" y="1136" class="h">scripts/chat_gold.py</text>
  <text x="234" y="1154" class="b">interactive RAG chat over Gold</text>
  <text x="234" y="1170" class="small">embed_question → top_k_gold_evolution (cosine) → answer_question()</text>
  <text x="234" y="1186" class="small">tags rows [latest version] vs [superseded]</text>

  <line x1="820" y1="1110" x2="820" y2="1036" class="edgeDashed" marker-end="url(#aGray)"/>
  <text x="820" y="1073" text-anchor="middle" class="edgeLabel">same functions as graph nodes</text>

  <rect x="680" y="1110" width="420" height="90" rx="10" class="surface"/>
  <text x="704" y="1136" class="h">scripts/backfill_gold.py</text>
  <text x="704" y="1154" class="b">standalone Gold rebuild</text>
  <text x="704" y="1170" class="small">reads silver_documents directly, no ACB re-run</text>
  <text x="704" y="1186" class="small">calls the same extract → resolve → persist functions</text>

  <!-- Legend -->
  <text x="150" y="1256" class="h">Legend</text>

  <rect x="150" y="1266" width="18" height="18" fill="#3987e5"/>
  <text x="180" y="1280" class="b">Bronze layer</text>
  <rect x="430" y="1266" width="18" height="18" fill="#d95926"/>
  <text x="460" y="1280" class="b">Silver layer</text>
  <rect x="710" y="1266" width="18" height="18" fill="#199e70"/>
  <text x="740" y="1280" class="b">Gold layer</text>
  <rect x="990" y="1266" width="18" height="18" fill="#9085e9"/>
  <text x="1020" y="1280" class="b">LLM Router / infra</text>

  <rect x="150" y="1306" width="18" height="18" fill="#d55181"/>
  <text x="180" y="1320" class="b">Human-in-the-loop</text>
  <rect x="430" y="1306" width="18" height="18" class="tableFill"/>
  <text x="460" y="1320" class="b">Postgres table</text>
  <line x1="710" y1="1315" x2="750" y2="1315" class="edge"/>
  <text x="760" y="1320" class="b">primary graph edge / data flow</text>
  <line x1="990" y1="1315" x2="1030" y2="1315" class="edgeDashed"/>
  <text x="1040" y="1320" class="b">async / side dependency</text>
</svg>
