[project]
name = "technical-meeting-rag"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.13",
    "anthropic>=0.40",
    "asyncpg>=0.29",
    "fastapi>=0.110",
    "jinja2>=3.1.6",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "litellm>=1.50",
    "logfire>=5.0.0",
    "openai>=1.0",
    "pgvector>=0.3",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.0",
    "pypdf>=6.18.1",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.32",
    "python-ulid==4.0.1",
    "requests>=2.34.2",
    "sentence-transformers>=3.0",
    "sqlalchemy[asyncio]>=2.0",
    "streamlit>=1.63.0",
    "structlog>=24.0",
    "tiktoken>=0.7.0",
    "torch>=2.2",
    "uvicorn[standard]>=0.27",
    "yt-dlp>=2026.8.19",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
]

[tool.uv.sources]
# This service runs on CPU only (no GPU in the container); the default PyPI
# torch wheel drags in ~8GB of unused CUDA/NVIDIA packages. Pin it to PyTorch's
# own CPU-only index instead.
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
# Scopes plain `pytest`/`make test` to the fast, mocked-LLM suite only. Without this,
# bare pytest discovery would also pick up each stage's real-LLM golden sets under
# agents/stages/<stage>/testing/ (deliberately excluded from the default run — see
# each suite's own README). Each stage package under agents/stages/ keeps its own
# fast unit tests in a `test/` subfolder, next to the code it tests, so this list
# adds one entry per stage that has tests — not every stage does (e.g. classification
# and adr_critic have none yet, only their real-LLM golden sets under `testing/`).
testpaths = [
    "tests",
    "agents/stages/architecture_questions/test",
    "agents/stages/data_contract_questions/test",
    "agents/stages/adr_generation/test",
    "agents/stages/gold/test",
]
filterwarnings = [
    # starlette 1.6.0 (latest available) still type-hints its TestClient with
    # anyio.abc.BlockingPortal internally; anyio flags that alias as deprecated
    # on import even though we never reference it ourselves. No newer starlette
    # fixes this yet — safe to silence until it does.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated, use anyio.from_thread.BlockingPortal instead:DeprecationWarning",
]
