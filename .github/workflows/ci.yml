name: CI

# Not wired to any secret or deployment step — this only runs the fast, deterministic
# suite (tests/, no LLM calls, no API keys needed) against a real Postgres + pgvector
# service, the same way `make test` does locally. See doc/evals.md for why the
# golden-set suites (real LLM calls, judged by a second LLM) are deliberately NOT run
# here: they cost real tokens and are not deterministic, so they stay a manual,
# on-purpose run, never a merge gate.

on:
  push:
    branches: [main, "finalproject-*"]
  pull_request:
    branches: [main, "finalproject-*"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: technical_meeting_rag_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Mirrors Makefile's TEST_DATABASE_URL exactly — the fast suite never touches a
      # dev database, only this throwaway one, recreated fresh on every run.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/technical_meeting_rag_test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      # The embedder and reranker pull small models from Hugging Face Hub on first use
      # (ingestion/embedder.py, ingestion/reranker.py) — cached so a re-run doesn't
      # re-download them.
      - name: Cache Hugging Face model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Run the fast test suite
        run: uv run pytest
